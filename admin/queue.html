<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Queue - Fix It Nerd</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="app-shell">
  <header class="site-header">
    <nav class="nav-shell">
      <a href="/index.html" class="logo"><img src="../assets/logo.png" alt="Fix It Nerd logo"><span>FixItNerd</span></a>
      <ul class="nav-links">
        <li><a href="/request.html">Request a Quote</a></li>
        <li><button class="cta-button" id="logoutBtn">Logout</button></li>
      </ul>
    </nav>
  </header>

  <section class="app-hero">
    <h1>Request Queue</h1>
    <p>Manage incoming requests, estimates, and payments.</p>
  </section>

  <main class="app-container">
    <p id="queueStatus" class="notice">Loading...</p>
    <div id="kanban" class="kanban"></div>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="/assets/js/identity.js"></script>
  <script src="/assets/js/adminQueue.js"></script>
  <script>
    document.querySelector("#logoutBtn").addEventListener("click", () => {
      window.Identity.logout();
      window.location.href = "/admin/login.html";
    });
  </script>
</body>
</html>
